<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel Observability</title>
    <desc id="description">Health checks, monitoring providers, and uptime status for Laravel.</desc>
    <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><rect width="800" height="200" rx="16" fill="url(#background)"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="36" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Laravel Observability</text>
        <text x="38" y="111" fill="#a8a29e" font-size="14">Know how your application is running.</text>
        <g transform="translate(38 134)"><rect x="0" width="91" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity=".8"/><text x="45.5" y="15" fill="#60a5fa" font-size="10" font-weight="500" text-anchor="middle">Health checks</text><rect x="101" width="112" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity=".8"/><text x="157.0" y="15" fill="#a78bfa" font-size="10" font-weight="500" text-anchor="middle">Provider discovery</text><rect x="223" width="62" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity=".8"/><text x="254.0" y="15" fill="#4ade80" font-size="10" font-weight="500" text-anchor="middle">Uptime</text><rect x="295" width="83" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8" opacity=".8"/><text x="336.5" y="15" fill="#fbbf24" font-size="10" font-weight="500" text-anchor="middle">Dark mode</text></g>
        <g transform="translate(570 36)">
            <rect width="194" height="128" rx="10" fill="#1c1917" stroke="#44403c"/>
            <circle cx="16" cy="17" r="4" fill="#4ade80"/>
            <text x="28" y="21" fill="#a8a29e" font-size="9" font-weight="600">SYSTEM HEALTH</text>
            <path d="M14 40 H180 M14 62 H180 M14 84 H180" fill="none" stroke="#44403c" stroke-width=".7"/>
            <polyline points="14,65 33,65 45,50 57,73 72,42 84,59 105,59 119,47 132,56 155,56 166,40 180,40" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="180" cy="40" r="3" fill="#4ade80"/>
            <rect x="14" y="96" width="49" height="18" rx="5" fill="#4ade80" opacity=".14"/>
            <rect x="72" y="96" width="49" height="18" rx="5" fill="#60a5fa" opacity=".14"/>
            <rect x="130" y="96" width="49" height="18" rx="5" fill="#a78bfa" opacity=".14"/>
            <text x="38" y="108" text-anchor="middle" fill="#4ade80" font-size="8">DATABASE</text>
            <text x="96" y="108" text-anchor="middle" fill="#60a5fa" font-size="8">CACHE</text>
            <text x="154" y="108" text-anchor="middle" fill="#a78bfa" font-size="8">STORAGE</text>
        </g>
    </g>
</svg>
