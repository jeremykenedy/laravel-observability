<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel Observability</title>
    <desc id="description">Health checks, monitoring providers, and uptime status for Laravel.</desc>
    <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="36" y="80" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-.5">Laravel Observability</text>
        <text x="38" y="111" fill="#64748b" font-size="14">Know how your application is running.</text>
        <g transform="translate(38 134)"><rect x="0" width="91" height="22" rx="11" fill="#eff6ff" stroke="#1e40af" stroke-width=".8"/><text x="45.5" y="15" fill="#1e40af" font-size="10" font-weight="500" text-anchor="middle">Health checks</text><rect x="101" width="112" height="22" rx="11" fill="#f5f3ff" stroke="#6d28d9" stroke-width=".8"/><text x="157.0" y="15" fill="#6d28d9" font-size="10" font-weight="500" text-anchor="middle">Provider discovery</text><rect x="223" width="62" height="22" rx="11" fill="#f0fdf4" stroke="#166534" stroke-width=".8"/><text x="254.0" y="15" fill="#166534" font-size="10" font-weight="500" text-anchor="middle">Uptime</text><rect x="295" width="83" height="22" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width=".8"/><text x="336.5" y="15" fill="#b45309" font-size="10" font-weight="500" text-anchor="middle">Dark mode</text></g>
        <g transform="translate(570 36)">
            <rect width="194" height="128" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
            <circle cx="16" cy="17" r="4" fill="#166534"/>
            <text x="28" y="21" fill="#64748b" font-size="9" font-weight="600">SYSTEM HEALTH</text>
            <path d="M14 40 H180 M14 62 H180 M14 84 H180" fill="none" stroke="#e2e8f0" stroke-width=".7"/>
            <polyline points="14,65 33,65 45,50 57,73 72,42 84,59 105,59 119,47 132,56 155,56 166,40 180,40" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="180" cy="40" r="3" fill="#166534"/>
            <rect x="14" y="96" width="49" height="18" rx="5" fill="#166534" opacity=".14"/>
            <rect x="72" y="96" width="49" height="18" rx="5" fill="#1e40af" opacity=".14"/>
            <rect x="130" y="96" width="49" height="18" rx="5" fill="#6d28d9" opacity=".14"/>
            <text x="38" y="108" text-anchor="middle" fill="#166534" font-size="8">DATABASE</text>
            <text x="96" y="108" text-anchor="middle" fill="#1e40af" font-size="8">CACHE</text>
            <text x="154" y="108" text-anchor="middle" fill="#6d28d9" font-size="8">STORAGE</text>
        </g>
    </g>
</svg>
